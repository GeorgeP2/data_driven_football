[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "football"
version = "0.1.0"
description = "Shared utilities for George Priestley's data-driven football projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "George Priestley" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29", "matplotlib>=3.8"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
    "pandas-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/football"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_template"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/notebooks/*.ipynb" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests", "*_project/tests"]
addopts = "-ra --import-mode=importlib"
norecursedirs = [".*", "data", "outputs"]

[tool.mypy]
ignore_missing_imports = true
files = ["src"]

[tool.coverage.run]
source = ["football"]
